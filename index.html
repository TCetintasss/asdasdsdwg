<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pixel-Perfect Tech Pack Filler</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="panel controls" aria-labelledby="controls-title">
        <h1 id="controls-title">Master Tech Pack Filler</h1>
        <p class="rule-callout">Upload the fixed master template first. The app never redraws, moves, resizes, or edits template boxes; it only scales inserted content inside the predefined boxes.</p>

        <label class="field">
          <span>Master template image</span>
          <input id="templateInput" type="file" accept="image/*" />
        </label>

        <div class="grid-fields">
          <label class="field"><span>Front flat sketch</span><input data-slot="front" type="file" accept="image/*" /></label>
          <label class="field"><span>Back flat sketch</span><input data-slot="back" type="file" accept="image/*" /></label>
          <label class="field"><span>Collar detail</span><input data-slot="collar" type="file" accept="image/*" /></label>
          <label class="field"><span>Chest pocket detail</span><input data-slot="chestPocket" type="file" accept="image/*" /></label>
          <label class="field"><span>Lower pocket detail</span><input data-slot="lowerPocket" type="file" accept="image/*" /></label>
          <label class="field"><span>Front closure detail</span><input data-slot="frontClosure" type="file" accept="image/*" /></label>
          <label class="field"><span>Sleeve detail</span><input data-slot="sleeve" type="file" accept="image/*" /></label>
          <label class="field"><span>Side vent detail</span><input data-slot="sideVent" type="file" accept="image/*" /></label>
          <label class="field"><span>Inside view</span><input data-slot="insideView" type="file" accept="image/*" /></label>
          <label class="field"><span>Fabric swatch</span><input data-slot="fabric" type="file" accept="image/*" /></label>
          <label class="field"><span>Logo</span><input data-slot="logo" type="file" accept="image/*" /></label>
        </div>

        <label class="field">
          <span>Size chart rows (one per line: code | measurement | size)</span>
          <textarea id="sizeChartInput" rows="5" placeholder="A | CHEST WIDTH (1/2) | 52 cm"></textarea>
        </label>

        <label class="field">
          <span>Technical / construction notes</span>
          <textarea id="notesInput" rows="5" placeholder="Use one note per line"></textarea>
        </label>

        <div class="actions">
          <button id="downloadButton" type="button">Download PNG</button>
          <button id="clearButton" type="button">Clear inserted content</button>
        </div>
      </section>

      <section class="panel preview" aria-labelledby="preview-title">
        <h2 id="preview-title">Locked Template Preview</h2>
        <canvas id="techPackCanvas" width="1536" height="1016" aria-label="Tech pack template preview"></canvas>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
